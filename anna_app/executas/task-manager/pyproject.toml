[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-dev-task-manager"
version = "0.1.1"
description = "Anna Executa plugin for the Task Management API"
requires-python = ">=3.10"

[project.scripts]
"tool-dev-task-manager" = "task_manager_plugin:main"

[tool.setuptools]
py-modules = ["task_manager_plugin"]
